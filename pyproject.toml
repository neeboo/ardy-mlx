[project]
name = "ardy-mlx"
version = "0.0.1"
description = "MLX (Apple Silicon) implementation of ARDY motion generation"
requires-python = ">=3.11"
dependencies = ["mlx>=0.20", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
